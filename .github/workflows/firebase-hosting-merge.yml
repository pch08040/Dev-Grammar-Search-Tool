# main 브랜치에 푸시·병합되면 빌드 후 실제 사이트에 배포
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV_GRAMMAR_SEARCH_TOOL }}
          channelId: live
          projectId: dev-grammar-search-tool

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevRef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)" id="hl-light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)" id="hl-dark">
<style>
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --border: #e3e6eb;
  --text: #1b1f24;
  --text-2: #57606a;
  --text-3: #8b949e;
  --flutter: #0b72c4;
  --flutter-soft: #e6f1fb;
  --spring: #4e9a2b;
  --spring-soft: #ebf5e4;
  --accent: #3b5bdb;
  --mark: #fff3a3;
  --code-bg: #f6f8fa;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #161a20; --surface-2: #1d222a; --border: #2a313b;
    --text: #e6e9ee; --text-2: #a4adb8; --text-3: #6f7a86;
    --flutter: #5cb3ff; --flutter-soft: #13283b; --spring: #8bd25f; --spring-soft: #1a2b14;
    --accent: #7c95ff; --mark: #5a4b00; --code-bg: #0d1117;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #161a20; --surface-2: #1d222a; --border: #2a313b;
  --text: #e6e9ee; --text-2: #a4adb8; --text-3: #6f7a86;
  --flutter: #5cb3ff; --flutter-soft: #13283b; --spring: #8bd25f; --spring-soft: #1a2b14;
  --accent: #7c95ff; --mark: #5a4b00; --code-bg: #0d1117;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
code, pre, kbd { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
a { color: var(--accent); }

/* ---------- header ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; white-space: nowrap; }
.logo-mark {
  width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--flutter), var(--spring)); color: #fff; font-size: 13px;
}
.search {
  flex: 1; max-width: 640px; position: relative; display: flex; align-items: center;
}
.search svg { position: absolute; left: 12px; color: var(--text-3); pointer-events: none; }
.search input {
  width: 100%; height: 40px; padding: 0 64px 0 38px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text);
  font: inherit; font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); background: var(--surface); }
.search kbd {
  position: absolute; right: 10px; font-size: 11px; color: var(--text-3);
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; background: var(--surface);
}
.stack-switch { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.stack-switch button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--text-2); white-space: nowrap;
}
.stack-switch button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.stack-switch button[data-stack="flutter"][aria-pressed="true"] { color: var(--flutter); }
.stack-switch button[data-stack="spring"][aria-pressed="true"] { color: var(--spring); }
.icon-btn {
  border: 1px solid var(--border); background: var(--surface); width: 36px; height: 36px; border-radius: 9px;
  display: grid; place-items: center; color: var(--text-2); flex: none;
}
.icon-btn:hover { color: var(--text); }

/* ---------- layout ---------- */
.layout {
  display: grid; grid-template-columns: 220px minmax(280px, 380px) 1fr;
  height: calc(100vh - 65px);
}
.side { border-right: 1px solid var(--border); padding: 16px 12px; overflow-y: auto; background: var(--surface); }
.side h3 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin: 16px 8px 6px; font-weight: 600; }
.side h3:first-child { margin-top: 0; }
.cat {
  display: flex; justify-content: space-between; align-items: center; width: 100%;
  border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; text-align: left; color: var(--text-2); font-size: 13.5px;
}
.cat:hover { background: var(--surface-2); color: var(--text); }
.cat[aria-current="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
.cat .n { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 8px; }
.dot.flutter { background: var(--flutter); } .dot.spring { background: var(--spring); }

.list { border-right: 1px solid var(--border); overflow-y: auto; }
.list-head {
  position: sticky; top: 0; background: var(--bg); padding: 12px 16px 8px; z-index: 2;
  display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-3);
}
.chip-toggle { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--text-2); }
.chip-toggle[aria-pressed="true"] { border-color: #e3b100; color: #a67c00; background: color-mix(in srgb, #ffd43b 18%, var(--surface)); }
.item {
  display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border);
  background: transparent; padding: 12px 16px;
}
.item:hover { background: var(--surface); }
.item[aria-selected="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
.item-top { display: flex; align-items: center; gap: 8px; }
.item-name { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 13.5px; }
.item-sum { color: var(--text-2); font-size: 12.5px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.badge { font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.badge.flutter { color: var(--flutter); background: var(--flutter-soft); }
.badge.spring { color: var(--spring); background: var(--spring-soft); }
.badge.kind { color: var(--text-2); background: var(--surface-2); }
.star { margin-left: auto; color: #e3b100; font-size: 12px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.empty { padding: 40px 20px; text-align: center; color: var(--text-3); }

/* ---------- detail ---------- */
.detail { overflow-y: auto; padding: 28px 36px 60px; }
.detail-inner { max-width: 820px; }
.crumb { font-size: 12px; color: var(--text-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.d-title { display: flex; align-items: center; gap: 12px; margin: 6px 0 4px; }
.d-title h1 { font-family: "JetBrains Mono", monospace; font-size: 24px; margin: 0; font-weight: 600; letter-spacing: -.01em; word-break: break-word; }
.fav-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--text-2); margin-left: auto; white-space: nowrap; }
.fav-btn[aria-pressed="true"] { color: #a67c00; border-color: #e3b100; }
.d-summary { font-size: 15px; color: var(--text-2); margin: 6px 0 20px; }
.section { margin-top: 24px; }
.section h2 { font-size: 13px; font-weight: 700; color: var(--text); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.sig { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 13px; overflow-x: auto; white-space: pre; }
table.params { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
table.params th, table.params td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.params th { background: var(--surface-2); font-size: 12px; color: var(--text-2); font-weight: 600; }
table.params tr:last-child td { border-bottom: 0; }
table.params td:first-child { font-family: "JetBrains Mono", monospace; white-space: nowrap; }
.req { font-size: 10px; color: #d6336c; font-weight: 700; margin-left: 4px; }
.code-wrap { position: relative; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--code-bg); }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px 6px 14px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-3); background: var(--surface); }
.copy { border: 1px solid var(--border); background: var(--surface-2); border-radius: 7px; padding: 2px 10px; font-size: 12px; color: var(--text-2); }
.copy.done { color: var(--spring); border-color: var(--spring); }
pre.code { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 13px; line-height: 1.65; }
pre.code code.hljs { background: transparent; padding: 0; }
.tip { display: flex; gap: 10px; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border)); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; }
.tip ul { margin: 0; padding-left: 18px; }
.related { display: flex; flex-wrap: wrap; gap: 6px; }
.related button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-family: "JetBrains Mono", monospace; font-size: 12.5px; }
.related button:hover { border-color: var(--accent); color: var(--accent); }
.doc-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; text-decoration: none; }
.back { display: none; }
.welcome { color: var(--text-2); }
.welcome h1 { font-size: 22px; color: var(--text); }
.kbd-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin-top: 12px; }
.kbd-list kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; font-size: 11.5px; background: var(--surface); justify-self: start; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .layout { grid-template-columns: 190px minmax(260px, 320px) 1fr; }
  .detail { padding: 24px; }
}
@media (max-width: 860px) {
  .top { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .search kbd { display: none; }
  .stack-switch { margin-left: auto; }
  .stack-switch button { padding: 5px 9px; font-size: 12px; }
  .layout { display: block; height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; }
  .side h3 { display: none; }
  .cat { width: auto; flex: none; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; gap: 6px; }
  .list { border-right: 0; }
  .detail { display: none; padding: 16px; }
  body.show-detail .list, body.show-detail .side { display: none; }
  body.show-detail .detail { display: block; }
  .back { display: inline-flex; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 4px 12px; margin-bottom: 12px; font-size: 13px; }
  .d-title h1 { font-size: 20px; }
}
</style>
</head>
<body>

<header class="top">
  <div class="logo"><span class="logo-mark">{ }</span>DevRef</div>
  <label class="search" aria-label="검색">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

  return FutureBuilder<List<User>>(
    future: _usersFuture,
    builder: (context, snapshot) {
      if (snapshot.connectionState != ConnectionState.done) {
        return const Center(child: CircularProgressIndicator());

/* 실서비스 목차(수록 예정 범위) */
const PLANNED = {
  flutter: ['기본 구조', '레이아웃', '텍스트 · 이미지', '입력 · 버튼', '목록', '화면 이동', '상태 관리', '비동기', '애니메이션', '테마 · 스타일', '네트워크 · 저장소', 'Dart 문법'],
  spring: ['Java 기초', '컬렉션 · 스트림', '날짜 · 시간', '앱 구조', '설정 · 프로퍼티', '웹 API', '데이터 (JPA)', '트랜잭션 · 예외', '보안', '테스트', '스케줄 · 비동기', 'Lombok']
};

/* =========================================================
   상태
   ========================================================= */
const byId = Object.fromEntries(ENTRIES.map(e => [e.id, e]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const state = {
  stack: 'all', cat: null, q: '', favOnly: false,
  selected: null, cursor: 0,
  favs: new Set(store.get('devref.favs', [])),
  results: []
};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STACK_LABEL = { flutter: 'Flutter · Dart', spring: 'Spring · Java' };

/* =========================================================
   검색: 이름 > 별칭 > 카테고리 > 설명 > 코드 순 가중치
   ========================================================= */
function score(e, tokens) {
  if (!tokens.length) return 1;
  let total = 0;
  const name = e.name.toLowerCase();
  const aliases = e.aliases.join(' ').toLowerCase();
  const meta = (e.cat + ' ' + e.kind).toLowerCase();
  const body = (e.summary + ' ' + (e.tips || []).join(' ')).toLowerCase();
  const code = (e.example || '').toLowerCase();
  for (const t of tokens) {
    let s = 0;
    if (name.startsWith(t)) s = 20;
    else if (name.includes(t)) s = 14;
    else if (aliases.includes(t)) s = 9;
    else if (meta.includes(t)) s = 5;
    else if (body.includes(t)) s = 3;
    else if (code.includes(t)) s = 1;
    if (!s) return 0;           // 모든 단어가 어딘가에 있어야 함
    total += s;
  }
  return total;
}

function hl(text, tokens) {
  let html = esc(text);
  for (const t of tokens) {
    if (!t) continue;
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    html = html.replace(re, '<mark>$1</mark>');
  }
  return html;
}

function compute() {
  const tokens = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  state.tokens = tokens;
  state.results = ENTRIES
    .filter(e => state.stack === 'all' || e.stack === state.stack)
    .filter(e => !state.cat || e.cat === state.cat)
    .filter(e => !state.favOnly || state.favs.has(e.id))
    .map(e => ({ e, s: score(e, tokens) }))
    .filter(r => r.s > 0)
    .sort((a, b) => b.s - a.s)
    .map(r => r.e);
  state.cursor = Math.min(state.cursor, Math.max(0, state.results.length - 1));
}

/* =========================================================

   ========================================================= */
function renderSide() {
  const stacks = state.stack === 'all' ? ['flutter', 'spring'] : [state.stack];
  let html = `<button class="cat" data-cat="" aria-current="${!state.cat}"><span>전체 보기</span><span class="n">${ENTRIES.filter(e => state.stack === 'all' || e.stack === state.stack).length}</span></button>`;
  for (const st of stacks) {
    html += `<h3><span class="dot ${st}"></span>${STACK_LABEL[st]}</h3>`;
    for (const c of PLANNED[st]) {
      const n = ENTRIES.filter(e => e.stack === st && e.cat === c).length;
      if (!n) continue;
      html += `<button class="cat" data-cat="${esc(c)}" aria-current="${state.cat === c}"><span>${esc(c)}</span><span class="n">${n}</span></button>`;
    }
  }
  $('#side').innerHTML = html;
}

function renderList() {
  const r = state.results;
  let html = `<div class="list-head"><span>${state.q ? `"${esc(state.q)}" 결과 ` : ''}${r.length}개</span>
    <button class="chip-toggle" id="favOnly" aria-pressed="${state.favOnly}">★ 즐겨찾기</button></div>`;
  if (!r.length) {
    html += `<div class="empty">검색 결과가 없습니다.<br>다른 키워드나 한글 별칭으로 검색해 보세요.</div>`;
  }
  r.forEach((e, i) => {
    html += `<button class="item" data-id="${e.id}" aria-selected="${state.selected === e.id}" ${i === state.cursor && state.q ? 'data-cursor="1"' : ''}>
      <div class="item-top">
        <span class="badge ${e.stack}">${e.stack === 'flutter' ? 'Flutter' : 'Spring'}</span>
        <span class="badge kind">${esc(e.kind)}</span>
        ${state.favs.has(e.id) ? '<span class="star">★</span>' : ''}
      </div>
      <div class="item-name">${hl(e.name, state.tokens)}</div>
      <div class="item-sum">${hl(e.summary, state.tokens)}</div>
    </button>`;
  });
  $('#list').innerHTML = html;
  const cur = $('#list [data-cursor]');
  if (cur) cur.style.boxShadow = 'inset 3px 0 0 var(--text-3)';
}

function renderDetail() {
  const e = byId[state.selected];
  const d = $('#detail');
  if (!e) {
    d.innerHTML = `<div class="detail-inner welcome">
      <h1>무엇을 찾고 계세요?</h1>
      <p>위젯 이름, 함수, 어노테이션은 물론 <b>한글 키워드</b>로도 검색할 수 있습니다.<br>
      예: <code>리스트</code>, <code>버튼 비활성화</code>, <code>롤백</code>, <code>null</code></p>
      <div class="kbd-list">
        <kbd>⌘K</kbd><span>또는 <kbd>/</kbd> 검색창으로 이동</span>
        <kbd>↑ ↓</kbd><span>결과 이동</span>
        <kbd>Enter</kbd><span>선택한 항목 열기</span>
        <kbd>Esc</kbd><span>검색어 지우기</span>
        <kbd>C</kbd><span>열린 항목의 예시 코드 복사</span>
      </div></div>`;
    return;
  }
  const fav = state.favs.has(e.id);
  d.innerHTML = `<div class="detail-inner">
    <button class="back" id="back">← 목록</button>
    <div class="crumb"><span class="badge ${e.stack}">${STACK_LABEL[e.stack]}</span><span>›</span><span>${esc(e.cat)}</span><span>›</span><span class="badge kind">${esc(e.kind)}</span></div>
    <div class="d-title"><h1>${esc(e.name)}</h1>
      <button class="fav-btn" id="fav" aria-pressed="${fav}">${fav ? '★ 즐겨찾기됨' : '☆ 즐겨찾기'}</button></div>
    <p class="d-summary">${esc(e.summary)}</p>

    ${e.signature ? `<div class="section"><h2>형태</h2><div class="sig">${esc(e.signature)}</div></div>` : ''}

    ${e.params ? `<div class="section"><h2>${e.kind === '위젯' ? '주요 속성' : '구성 요소'}</h2>
      <table class="params"><thead><tr><th>이름</th><th>타입</th><th>설명</th></tr></thead><tbody>
      ${e.params.map(p => `<tr><td>${esc(p[0])}</td><td><code>${esc(p[1])}</code></td><td>${esc(p[2])}</td></tr>`).join('')}
      </tbody></table></div>` : ''}

    <div class="section"><h2>사용 예시</h2>
      <div class="code-wrap">
        <div class="code-bar"><span>${e.lang === 'dart' ? 'Dart' : 'Java'}</span><button class="copy" id="copy">복사</button></div>
        <pre class="code"><code class="language-${e.lang}" id="code"></code></pre>
      </div></div>

    ${e.tips ? `<div class="section"><h2>주의할 점</h2><div class="tip"><span>💡</span><ul>${e.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></div>` : ''}

    ${e.related && e.related.length ? `<div class="section"><h2>함께 보면 좋은 항목</h2><div class="related">
      ${e.related.filter(id => byId[id]).map(id => `<button data-go="${id}">${esc(byId[id].name)}</button>`).join('')}</div></div>` : ''}

    <div class="section"><a class="doc-link" href="${e.doc}" target="_blank" rel="noopener">공식 문서 보기 ↗</a></div>
  </div>`;
  const codeEl = $('#code');
  codeEl.textContent = e.example;
  if (window.hljs) { try { hljs.highlightElement(codeEl); } catch {} }
  d.scrollTop = 0;
}

function render() { compute(); renderSide(); renderList(); renderDetail(); }

/* =========================================================
   동작
   ========================================================= */
function select(id, push = true) {
  state.selected = id;
  if (push && id) history.replaceState(null, '', '#' + id);
  document.body.classList.toggle('show-detail', !!id);
  renderList(); renderDetail();
}

function copyCode() {
  const e = byId[state.selected]; if (!e) return;
  const done = () => { const b = $('#copy'); if (b) { b.textContent = '복사됨'; b.classList.add('done'); setTimeout(() => { b.textContent = '복사'; b.classList.remove('done'); }, 1400); } };
  if (navigator.clipboard) navigator.clipboard.writeText(e.example).then(done, done); else done();
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.stack) {
    state.stack = t.dataset.stack; state.cat = null;
    document.querySelectorAll('.stack-switch button').forEach(b => b.setAttribute('aria-pressed', b === t));
    render();
  } else if (t.classList.contains('cat')) {
    state.cat = t.dataset.cat || null; render();
  } else if (t.dataset.id) {
    select(t.dataset.id);
  } else if (t.dataset.go) {
    state.q = ''; $('#q').value = ''; compute(); select(t.dataset.go);
  } else if (t.id === 'favOnly') {
    state.favOnly = !state.favOnly; render();
  } else if (t.id === 'fav') {
    const id = state.selected;
    state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
    store.set('devref.favs', [...state.favs]); compute(); renderList(); renderDetail();
  } else if (t.id === 'copy') {
    copyCode();
  } else if (t.id === 'back') {
    state.selected = null; document.body.classList.remove('show-detail'); history.replaceState(null, '', location.pathname); renderList(); renderDetail();
  } else if (t.id === 'theme') {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    store.set('devref.theme', root.dataset.theme); syncHlTheme();
  }
});

$('#q').addEventListener('input', ev => { state.q = ev.target.value; state.cursor = 0; compute(); renderList(); });

document.addEventListener('keydown', ev => {
  const inInput = document.activeElement === $('#q');
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k' || (!inInput && ev.key === '/')) {
    ev.preventDefault(); $('#q').focus(); $('#q').select(); return;
  }
  if (inInput && ev.key === 'ArrowDown') { ev.preventDefault(); state.cursor = Math.min(state.cursor + 1, state.results.length - 1); renderList(); }
  else if (inInput && ev.key === 'ArrowUp') { ev.preventDefault(); state.cursor = Math.max(state.cursor - 1, 0); renderList(); }
  else if (inInput && ev.key === 'Enter') { const e = state.results[state.cursor]; if (e) select(e.id); }
  else if (inInput && ev.key === 'Escape') { $('#q').value = ''; state.q = ''; compute(); renderList(); }
  else if (!inInput && ev.key.toLowerCase() === 'c' && !ev.metaKey && !ev.ctrlKey) { copyCode(); }
});

function syncHlTheme() {
  const t = document.documentElement.dataset.theme;
  $('#hl-light').media = t ? (t === 'light' ? 'all' : 'not all') : '(prefers-color-scheme: light)';
  $('#hl-dark').media = t ? (t === 'dark' ? 'all' : 'not all') : '(prefers-color-scheme: dark)';
}

(function init() {
  const saved = store.get('devref.theme', null);
  if (saved) document.documentElement.dataset.theme = saved;
  syncHlTheme();
  render();
  const hash = location.hash.slice(1);
  if (byId[hash]) select(hash, false);
})();
</script>
</body>
</html>
